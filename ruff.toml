# Conservative configuration: real errors only, no style imposed on existing code.
# Run with: python -m ruff check .   (from the repository root)

[lint]
# E9 = syntax/indentation errors; F = pyflakes (undefined name, unused import,
# f-string without placeholder, redefinition); B = bugbear (probable bugs, e.g.
# a mutable default argument).
select = ["E9", "F", "B"]

# F403/F405: the project uses `from tkinter import *` by style; do not report.
ignore = ["F403", "F405"]
